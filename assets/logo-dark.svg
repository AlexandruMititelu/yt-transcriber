<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B1F16"/>
      <stop offset="1" stop-color="#140D08"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFBF2"/>
      <stop offset="0.55" stop-color="#F5E3C3"/>
      <stop offset="1" stop-color="#E8B478"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5A3A1E" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#5A3A1E" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#F3C98B" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#F3C98B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect width="512" height="512" rx="115" fill="url(#halo)"/>

  <!-- Folded ribbon T in cream, warming only slightly toward the point -->
  <g fill="url(#ribbon)">
    <rect x="112" y="136" width="288" height="76" rx="38"/>
    <path d="M218 212 H294 V352 L256 412 L218 352 Z"/>
  </g>
  <rect x="112" y="136" width="288" height="76" rx="38" fill="url(#sheen)"/>
  <path d="M218 212 H294 V290 Z" fill="url(#fold)"/>
</svg>
